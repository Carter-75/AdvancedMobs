plugins {
    id 'fabric-loom' version '1.16.1'
    id 'java'
}

group = "mod.advancedmobs"
version = "1.0.0"

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // MC 26.x is unobfuscated (fabric.loom.disableObfuscation=true in
    // gradle.properties), so Loom runs in no-remap mode and never creates
    // the mod* configurations. Do NOT "restore" modImplementation here:
    // it fails evaluation with "Could not find method modImplementation()".
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.terraformersmc:modmenu:20.0.3"
    implementation "me.shedaniel.cloth:cloth-config-fabric:26.2.155"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
	main {
		java {
			srcDirs += [
				'src/client/java'
			]
		}
	}
}
